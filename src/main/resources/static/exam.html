<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答题 - 在线答题系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="topbar-root"></div>

<div class="page">

  <div id="start-screen" class="card" style="text-align:center; padding:48px 24px">
    <h2>准备好了吗？</h2>
    <p class="hint">点击开始后会立即抽题并计时（如果是考试模式），请确保准备就绪。</p>
    <div class="actions" style="justify-content:center">
      <button class="primary" id="btn-start">开始答题</button>
    </div>
  </div>

  <div id="exam-screen" style="display:none">
    <div class="page-header">
      <div>
        <h1 id="exam-title">答题中</h1>
        <p id="exam-progress" class="hint">共 0 题</p>
      </div>
      <div id="timer-wrap"></div>
    </div>
    <div id="banner" class="banner" style="display:none"></div>
    <div class="card" id="question-list"></div>
    <div class="actions">
      <button class="primary" id="btn-submit">交卷</button>
    </div>
  </div>

  <div id="result-screen" style="display:none">
    <div class="card">
      <div class="score-hero">
        <div class="num" id="result-score">0</div>
        <div class="label">满分 <span id="result-total">0</span> 分 · <span id="result-pass"></span></div>
      </div>
    </div>
    <div class="card">
      <h2>逐题解析</h2>
      <div id="result-detail"></div>
    </div>
    <div class="actions">
      <a class="btn" href="papers.html">返回试卷列表</a>
      <a class="btn" href="wrongbook.html">查看错题本</a>
    </div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
renderNav('papers');

const params = new URLSearchParams(location.search);
const paperId = params.get('paperId');
const banner = document.getElementById('banner');

let examState = null; // { recordId, questions: [...] }
let timerHandle = null;
let secondsLeft = 0;

const TYPE_LABEL = { SINGLE: '单选题', MULTIPLE: '多选题', JUDGE: '判断题', SHORT_ANSWER: '简答题' };

document.getElementById('btn-start').addEventListener('click', startExam);

async function startExam() {
  try {
    const resp = await Api.post('/api/exam/start', undefined, { paperId, userId: Session.getUserId() });
    examState = { recordId: resp.recordId, questions: resp.questions };

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('exam-screen').style.display = 'block';
    document.getElementById('exam-progress').textContent = `共 ${resp.questions.length} 题`;
    renderQuestions(resp.questions);

    if (resp.durationMinutes) {
      secondsLeft = resp.durationMinutes * 60;
      renderTimer();
      timerHandle = setInterval(() => {
        secondsLeft--;
        renderTimer();
        if (secondsLeft <= 0) {
          clearInterval(timerHandle);
          alert('时间到，自动交卷');
          submitExam();
        }
      }, 1000);
    }
  } catch (e) {
    showBanner(banner, e.message);
  }
}

function renderTimer() {
  const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
  const s = (secondsLeft % 60).toString().padStart(2, '0');
  document.getElementById('timer-wrap').innerHTML = `<span class="timer">⏱ ${m}:${s}</span>`;
}

function renderQuestions(questions) {
  const wrap = document.getElementById('question-list');
  wrap.innerHTML = questions.map((q, idx) => {
    let inputsHtml = '';
    if (q.type === 'SINGLE') {
      inputsHtml = Object.entries(q.options || {}).map(([k, v]) => `
        <label class="option-row">
          <input type="radio" name="q-${q.questionId}" value="${k}">
          <span><strong>${k}.</strong> ${escapeHtml(v)}</span>
        </label>`).join('');
    } else if (q.type === 'MULTIPLE') {
      inputsHtml = Object.entries(q.options || {}).map(([k, v]) => `
        <label class="option-row">
          <input type="checkbox" name="q-${q.questionId}" value="${k}">
          <span><strong>${k}.</strong> ${escapeHtml(v)}</span>
        </label>`).join('');
    } else if (q.type === 'JUDGE') {
      inputsHtml = ['对', '错'].map((v) => `
        <label class="option-row">
          <input type="radio" name="q-${q.questionId}" value="${v}">
          <span>${v}</span>
        </label>`).join('');
    } else {
      inputsHtml = `<textarea name="q-${q.questionId}" rows="3" placeholder="输入你的作答"></textarea>`;
    }

    return `
      <div class="question-block" data-qid="${q.questionId}" data-type="${q.type}">
        <div class="question-stem">
          <span class="question-num">${idx + 1}</span>
          ${escapeHtml(q.stem)}
          <span class="badge neutral" style="margin-left:6px">${TYPE_LABEL[q.type]} · ${q.score}分</span>
        </div>
        ${inputsHtml}
      </div>
    `;
  }).join('');
}

function collectAnswers() {
  return examState.questions.map((q) => {
    const block = document.querySelector(`[data-qid="${q.questionId}"]`);
    let answer = '';
    if (q.type === 'MULTIPLE') {
      const checked = Array.from(block.querySelectorAll('input[type=checkbox]:checked')).map((el) => el.value);
      answer = checked.join('');
    } else if (q.type === 'SHORT_ANSWER') {
      answer = block.querySelector('textarea').value.trim();
    } else {
      const checked = block.querySelector('input:checked');
      answer = checked ? checked.value : '';
    }
    return { questionId: q.questionId, answer };
  });
}

document.getElementById('btn-submit').addEventListener('click', () => {
  if (confirm('确定交卷吗？交卷后不能修改作答。')) submitExam();
});

async function submitExam() {
  if (timerHandle) clearInterval(timerHandle);
  try {
    const result = await Api.post('/api/exam/submit', {
      recordId: examState.recordId,
      answers: collectAnswers(),
    }, { userId: Session.getUserId() });
    showResult(result);
  } catch (e) {
    showBanner(banner, e.message);
  }
}

function showResult(result) {
  document.getElementById('exam-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  document.getElementById('result-score').textContent = result.score;
  document.getElementById('result-score').style.color = result.pass ? 'var(--teal)' : 'var(--red)';
  document.getElementById('result-total').textContent = result.totalScore;
  document.getElementById('result-pass').textContent = result.pass ? '✅ 及格' : '❌ 未及格';

  document.getElementById('result-detail').innerHTML = result.details.map((d, idx) => {
    const isPending = d.correct === null;
    const statusBadge = isPending
      ? '<span class="badge neutral">待人工阅卷</span>'
      : d.correct ? '<span class="badge teal">✓ 正确</span>' : '<span class="badge red">✗ 错误</span>';
    return `
      <div class="question-block">
        <div class="question-stem"><span class="question-num">${idx + 1}</span>${escapeHtml(d.stem)} ${statusBadge}</div>
        <div class="meta">你的作答：${escapeHtml(d.userAnswer || '（未作答）')}</div>
        ${!isPending ? `<div class="meta">正确答案：${escapeHtml(d.correctAnswer || '-')} · 得分 ${d.score}</div>` : ''}
        ${d.analysis ? `<div class="meta">解析：${escapeHtml(d.analysis)}</div>` : ''}
      </div>
    `;
  }).join('');
}
</script>
</body>
</html>
